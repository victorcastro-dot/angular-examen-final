<section class="hero rounded-4 text-white p-4 p-md-5 mb-4">
  <h1 class="fw-bold mb-2">Talleres disponibles</h1>
  <p class="mb-0 opacity-75">Encuentra un taller, revisa los cupos libres e inscríbete en pocos pasos.</p>
</section>

<div class="card border-0 shadow-sm rounded-4 mb-4">
  <div class="card-body">
    <div class="row g-2">
      <div class="col-12 col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input
            type="search"
            class="form-control"
            placeholder="Buscar por nombre o instructor..."
            [value]="busqueda()"
            (input)="buscar($any($event.target).value)"
          />
        </div>
      </div>
      <div class="col col-md-4">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-funnel"></i></span>
          <select
            class="form-select"
            [value]="categoria()"
            (change)="filtrarPorCategoria($any($event.target).value)"
          >
            <option value="">Todas las categorías</option>
            @for (c of categorias(); track c) {
              <option [value]="c">{{ c }}</option>
            }
          </select>
        </div>
      </div>
      <div class="col-auto col-md-2 d-grid">
        <button
          type="button"
          class="btn btn-limpiar"
          [disabled]="!hayFiltros()"
          (click)="limpiar()"
          title="Quitar búsqueda y filtro"
          aria-label="Limpiar filtros"
        >
          <i class="bi bi-arrow-counterclockwise"></i><span class="d-none d-sm-inline ms-1">Limpiar</span>
        </button>
      </div>
    </div>
  </div>
</div>

@if (cargando()) {
  <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
} @else {
  <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
    @for (t of paginados(); track t.id) {
      <div class="col">
        <app-taller-card [taller]="t" (inscribir)="irAInscribir($event)" />
      </div>
    } @empty {
      <div class="col-12">
        <div class="alert alert-info">No hay talleres que coincidan con la búsqueda.</div>
      </div>
    }
  </div>

  <div class="mt-4">
    <app-paginador
      [total]="filtrados().length"
      [porPagina]="porPagina"
      [pagina]="pagina()"
      (cambiarPagina)="pagina.set($event)"
    />
  </div>
}
