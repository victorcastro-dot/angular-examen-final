@if (total() > 0) {
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
    <span class="text-muted small">Mostrando {{ desde() }}–{{ hasta() }} de {{ total() }}</span>

    @if (totalPaginas() > 1) {
      <nav aria-label="Paginación">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item" [class.disabled]="pagina() === 1">
            <button type="button" class="page-link" (click)="ir(pagina() - 1)" aria-label="Página anterior">
              <i class="bi bi-chevron-left"></i>
            </button>
          </li>
          @for (p of paginas(); track p) {
            <li class="page-item" [class.active]="p === pagina()">
              <button type="button" class="page-link" (click)="ir(p)" [attr.aria-current]="p === pagina() ? 'page' : null">
                {{ p }}
              </button>
            </li>
          }
          <li class="page-item" [class.disabled]="pagina() === totalPaginas()">
            <button type="button" class="page-link" (click)="ir(pagina() + 1)" aria-label="Página siguiente">
              <i class="bi bi-chevron-right"></i>
            </button>
          </li>
        </ul>
      </nav>
    }
  </div>
}
